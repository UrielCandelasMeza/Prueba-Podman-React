# Este es un compose para podman para no tener que instalar ninguna cosa rara
# dentro del server.

services:
  app:
    image: oven/bun:latest
    working_dir: /app
    volumes:
      - ./:/app/:Z
      - node_modules:/app/node_modules
    ports:
      - 127.0.0.1:5173:5173
    command: sh -c "bun install && bun run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped

volumes:
  node_modules:
